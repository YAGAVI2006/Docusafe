<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCUSAFE - Login</title>
    <!-- Bootstrap CSS for grid -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5 pt-5 animate-fade-in">
    <div class="row justify-content-center mb-4">
        <div class="col-md-6 text-center">
            <h1 class="display-4 fw-bold" style="background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">DOCUSAFE</h1>
            <p class="text-muted mt-2" style="font-size: 1.1rem;">Secure Cloud Document Management</p>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-5">
                <h3 class="text-center mb-4 fw-bold">Welcome Back</h3>
                <div id="loginAlert" class="alert alert-danger d-none glass-badge badge-danger"></div>
                <form id="loginForm">
                    <div class="mb-4">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control glass-input" id="email" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-5">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control glass-input" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-glass-primary w-100">Sign In</button>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted" style="font-size: 0.9rem;">Don't have an account? <a href="register.html" class="text-decoration-none fw-bold ms-1">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
