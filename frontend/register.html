<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCUSAFE - Register</title>
    <!-- Bootstrap CSS for grid -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5 pt-4 animate-fade-in">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-5">
                <h3 class="text-center mb-4 fw-bold" style="background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Create Account</h3>
                <div id="regAlert" class="alert alert-danger d-none glass-badge badge-danger"></div>
                <form id="regForm">
                    <div class="mb-4">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control glass-input" id="fullName" placeholder="John Doe" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control glass-input" id="regEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-5">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control glass-input" id="regPassword" placeholder="Create a strong password" required>
                    </div>
                    <button type="submit" class="btn btn-glass-primary w-100">Register</button>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted" style="font-size: 0.9rem;">Already have an account? <a href="index.html" class="text-decoration-none fw-bold ms-1">Sign in</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
